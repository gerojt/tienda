{% extends "base.html" %}

{% block title %}{{ 'Editar' if customer else 'Agregar' }} Cliente - Tienda{% endblock %}

{% block content %}
<h1>{{ 'Editar' if customer else 'Agregar' }} Cliente</h1>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Nombre del Cliente:</label>
            <input type="text" id="name" name="name" value="{{ customer.name if customer else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" value="{{ customer.email if customer else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="phone">Teléfono:</label>
            <input type="text" id="phone" name="phone" value="{{ customer.phone if customer else '' }}">
        </div>
        
        <div class="form-group">
            <label for="address">Dirección:</label>
            <textarea id="address" name="address">{{ customer.address if customer else '' }}</textarea>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('customers') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
