{% extends "base.html" %}

{% block title %}{{ 'Editar' if product else 'Agregar' }} Producto - Tienda{% endblock %}

{% block content %}
<h1>{{ 'Editar' if product else 'Agregar' }} Producto</h1>

<div class="card">
    <form method="POST">
        <div class="form-group">
            <label for="name">Nombre del Producto:</label>
            <input type="text" id="name" name="name" value="{{ product.name if product else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="description">Descripción:</label>
            <textarea id="description" name="description">{{ product.description if product else '' }}</textarea>
        </div>
        
        <div class="form-group">
            <label for="price">Precio:</label>
            <input type="number" id="price" name="price" step="0.01" min="0" value="{{ product.price if product else '' }}" required>
        </div>
        
        <div class="form-group">
            <label for="stock">Stock:</label>
            <input type="number" id="stock" name="stock" min="0" value="{{ product.stock if product else 0 }}" required>
        </div>
        
        <div style="display: flex; gap: 10px;">
            <button type="submit" class="btn btn-success">Guardar</button>
            <a href="{{ url_for('products') }}" class="btn">Cancelar</a>
        </div>
    </form>
</div>
{% endblock %}
